name: AI MLOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: phucnguyen210/hanoi-pm25-softs-dinov3

jobs:
  # -------------------------------------------------------------
  # GIAI ĐOẠN 1: CONTINUOUS INTEGRATION (CI)
  # - Linting, kiểm tra kiến trúc model AI & chạy Unit / Integration Tests
  # -------------------------------------------------------------
  ci_test_and_validation:
    name: 🧪 CI - Model & API Validation
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔬 Run Unit & Integration Tests (Pytest)
        run: |
          python -m pytest tests/ -v --tb=short

  # -------------------------------------------------------------
  # GIAI ĐOẠN 2: CONTINUOUS DEPLOYMENT (CD)
  # - Đóng gói Docker Image cho AI model và phát hành (public) lên Docker Hub
  # -------------------------------------------------------------
  cd_docker_hub_publish:
    name: 🐳 CD - Build & Push Docker Image
    needs: ci_test_and_validation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔍 Check Docker Credentials Configuration
        run: |
          echo "Target Docker Hub User: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || 'phucnguyen210' }}"
          if [ -z "${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_PASSWORD }}" ]; then
            echo "::error::Docker token/password is empty! Vui long kiem tra secret DOCKERHUB_TOKEN."
            exit 1
          fi
          echo "✅ Docker token is present."

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || 'phucnguyen210' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_PASSWORD }}

      - name: 🏷️ Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch

      - name: 🚀 Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
